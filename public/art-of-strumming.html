<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Art of Strumming | Todd Brannon Music</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F0F8FF;
      color: #1A2E42;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 1.25rem 2rem;
    }
    header .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C9A84C;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: linear-gradient(to bottom, #F0F8FF, #FEF7E0);
    }

    .card {
      background: #fff;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(26,46,66,0.08);
      max-width: 560px;
      width: 100%;
      padding: 3rem 2.5rem;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C9A84C;
      margin-bottom: 1rem;
    }

    .card h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      color: #1A2E42;
      margin: 0 0 1rem;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.7;
      color: #4a5568;
      margin: 0 0 2rem;
    }

    .pdf-icon {
      width: 56px;
      height: 56px;
      border-radius: 0.75rem;
      background: rgba(201,168,76,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .pdf-icon svg {
      width: 28px;
      height: 28px;
      color: #C9A84C;
      stroke: #C9A84C;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.875rem 2rem;
      background: #C9A84C;
      color: #1A2E42;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 0.6rem;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .download-btn:hover {
      background: #b8953d;
      transform: translateY(-1px);
    }
    .download-btn:active {
      transform: translateY(0);
    }
    .download-btn svg {
      width: 18px;
      height: 18px;
      stroke: #1A2E42;
    }

    footer {
      background: #fff;
      border-top: 1px solid rgba(201,168,76,0.2);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
    }
    footer a {
      color: #888;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="/">Todd Brannon Music</a>
  </header>

  <main>
    <div class="card">

      <div class="pdf-icon">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
               0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l3 3m0
               0l3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125
               1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0
               1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
      </div>

      <span class="eyebrow">Learning Resource</span>
      <h1>The Art of Strumming</h1>
      <p>
        A focused guide to developing rhythm, feel, and confidence with the strum hand.
        Download the PDF to use alongside your lessons.
      </p>

      <a class="download-btn" href="/resources/art-of-strumming.pdf" download>
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
        </svg>
        Download PDF
      </a>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 <a href="https://www.toddbrannonmusic.com">Todd Brannon Music</a>. All rights reserved.</p>
  </footer>

</body>
</html>
