<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f7f7f7; }
    .login-box { max-width: 340px; margin: 80px auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px #0001; }
    input, button { width: 100%; margin-bottom: 1rem; padding: 0.7rem; border-radius: 4px; border: 1px solid #ccc; }
    button[type="submit"] { background: #1A2E42; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    button[type="submit"]:hover { background: #C9A84C; color: #1A2E42; }
    .error { color: #c00; margin-bottom: 1rem; }
    .password-wrapper { position: relative; }
    .password-wrapper input { margin-bottom: 0; padding-right: 2.5rem; }
    .toggle-pw { position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; margin: 0; width: auto; color: #888; }
    .toggle-pw:hover { color: #1A2E42; }
    .spacer { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required />
      <div class="password-wrapper spacer">
        <input type="password" name="password" id="passwordInput" placeholder="Password" required />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="error" id="errorMsg"></div>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    // Password toggle
    const togglePw = document.getElementById('togglePw');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>`

    togglePw.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
    });

    // Login form
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location = '/admin';
      } else {
        document.getElementById('errorMsg').textContent = data.message || 'Login failed';
      }
    };
  </script>
</body>
</html>
